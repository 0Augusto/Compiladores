name: Static Analysis Pipeline

env:
  LLVM_VERSION: "14.0.0"
  COMPILER: "clang"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup LLVM
        run: |
          apt-get update
          apt-get install -y llvm-$LLVM_VERSION-dev clang-$LLVM_VERSION

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install cpplint clang-format

      - name: Build analyzer
        run: |
          $COMPILER deadcode_analyzer.c -o deadcode_analyzer
          chmod +x deadcode_analyzer

      - name: Run code analysis
        run: |
          for file in $(find . -name "*.c"); do
            ./deadcode_analyzer "$file"
            cpplint "$file"
            clang-format -i "$file"
          done

      - name: Generate report
        run: |
          echo "## Static Analysis Results" > report.md
          echo "* Date: $(date)" >> report.md
          echo "* Files analyzed: $(find . -name '*.c' | wc -l)" >> report.md

      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: analysis-report
          path: report.md

notifications:
  email:
    recipients:
      - dev-team@example.com
    on_success: change
    on_failure: always

settings:
  max_file_size: 1MB
  ignore_patterns:
    - "**/*.o"
    - "**/*.tmp"
    - "**/build/*"
  
  analysis_rules:
    - check_dead_code: true
    - check_style: true
    - check_format: true
